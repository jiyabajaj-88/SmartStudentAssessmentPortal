<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessments – SmartPortal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav></nav>

<div class="page">
  <div class="page-header">
    <h1>Assessments</h1>
    <p>All assessments available for your class.</p>
  </div>

  <div id="assessList"></div>
</div>

<!-- TAKE ASSESSMENT MODAL -->
<div class="modal-overlay" id="assessModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Assessment</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="modalAlert"></div>
      <div id="modalContent"></div>
      <div id="modalFooter" class="mt-3 flex-between"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  if (!requireAuth()) throw '';
  renderNav('assessments.html');

  let currentAssessment = null;
  let currentSubmission = null;
  let questions = [];
  let answers = {};  // question_id -> { selected_option_id?, answer_text? }

  async function loadAssessments() {
    const el = document.getElementById('assessList');
    showLoading(el);
    try {
      const [data, submissions] = await Promise.all([
        apiFetch('/assessments'),
        apiFetch('/submissions')
      ]);
      if (!data?.length) { showEmpty(el, '📝', 'No assessments available for your class right now.'); return; }

      // Build a map: assessment_id -> array of submissions
      const subMap = {};
      (submissions || []).forEach(s => {
        if (!subMap[s.assessment_id]) subMap[s.assessment_id] = [];
        subMap[s.assessment_id].push(s);
      });

      // Classify each assessment
      const pending = [];
      const completed = [];
      const retake = [];

      data.forEach(a => {
        const subs = subMap[a.assessment_id];
        if (!subs || subs.length === 0) {
          pending.push(a);
        } else {
          completed.push(a);
          // Retake is allowed for all assessments right now
          retake.push(a);
        }
      });

      let html = '';

      // Pending section
      if (pending.length) {
        html += `<div class="assess-section">
          <div class="assess-section-header">
            <span class="assess-section-icon pending">◷</span>
            <h2>Pending</h2>
            <span class="badge">${pending.length}</span>
          </div>
          <div class="card-grid">${pending.map(a => renderAssessCard(a, 'pending', null)).join('')}</div>
        </div>`;
      }

      // Completed section
      if (completed.length) {
        html += `<div class="assess-section">
          <div class="assess-section-header">
            <span class="assess-section-icon completed">✓</span>
            <h2>Completed</h2>
            <span class="badge success">${completed.length}</span>
          </div>
          <div class="card-grid">${completed.map(a => {
            const latest = subMap[a.assessment_id].sort((x, y) =>
              new Date(y.submitted_at) - new Date(x.submitted_at)
            )[0];
            return renderAssessCard(a, 'completed', latest);
          }).join('')}</div>
        </div>`;
      }

      // Retake section
      if (retake.length) {
        html += `<div class="assess-section">
          <div class="assess-section-header">
            <span class="assess-section-icon retake">↺</span>
            <h2>Retake Available</h2>
            <span class="badge info">${retake.length}</span>
          </div>
          <div class="card-grid">${retake.map(a => renderAssessCard(a, 'retake', null)).join('')}</div>
        </div>`;
      }

      if (!html) { showEmpty(el, '📝', 'No assessments available for your class right now.'); return; }
      el.innerHTML = html;
    } catch (e) {
      showAlert(document.getElementById('assessList'), 'error', 'Could not load assessments: ' + formatError(e.detail));
    }
  }

  function renderAssessCard(a, status, latestSub) {
    const statusConfig = {
      pending:   { label: 'Pending',   cls: 'accent',  icon: '◷', action: 'Take Assessment →' },
      completed: { label: 'Completed', cls: 'success', icon: '✓', action: 'View Submitted Answers →' },
      retake:    { label: 'Retake',    cls: 'info',     icon: '↺', action: 'Retake Assessment →' }
    };
    const s = statusConfig[status];

    const submittedInfo = latestSub
      ? `<span class="text-sm text-muted" style="margin-top:.35rem;display:block">Last submitted: ${formatDate(latestSub.submitted_at)}</span>`
      : '';

    // Completed cards go to feedback page; pending/retake open the assessment modal
    const clickAction = status === 'completed' && latestSub
      ? `window.location.href='feedback.html?submission_id=${latestSub.submission_id}'`
      : `openAssessment(${a.assessment_id})`;

    return `
      <div class="assessment-card assess-status-${status}" onclick="${clickAction}">
        <div class="assess-status-badge">
          <span class="badge ${s.cls}">${s.icon} ${s.label}</span>
        </div>
        <h3>${escapeHtml(a.title)}</h3>
        <p class="text-muted text-sm mt-1">${escapeHtml(a.subject)}</p>
        ${submittedInfo}
        <div class="meta-row">
          <span class="badge">Class ${escapeHtml(a.class_name)}</span>
          <span class="badge accent">${a.max_marks} marks</span>
        </div>
        <div class="assess-action text-sm">${s.action}</div>
      </div>`;
  }

  async function openAssessment(id) {
    currentAssessment = id;
    answers = {};
    document.getElementById('assessModal').classList.add('show');

    const mc = document.getElementById('modalContent');
    const mf = document.getElementById('modalFooter');
    const ma = document.getElementById('modalAlert');
    ma.innerHTML = '';
    showLoading(mc);
    mf.innerHTML = '';

    try {
      const [assessment, qs] = await Promise.all([
        apiFetch(`/assessments/${id}`),
        apiFetch(`/assessments/${id}/questions`),
      ]);
      questions = qs || [];
      document.getElementById('modalTitle').textContent = assessment.title;

      mc.innerHTML = `
        <div style="margin-bottom:1.25rem">
          <div class="meta-row">
            <span class="badge">${escapeHtml(assessment.subject)}</span>
            <span class="badge info">${assessment.max_marks} marks total</span>
            <span class="badge">${questions.length} questions</span>
          </div>
        </div>
        ${questions.map((q, i) => renderQuestion(q, i)).join('')}
      `;

      mf.innerHTML = `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="submitBtn" onclick="startAndSubmit(${id})">Submit Assessment</button>
      `;
    } catch (e) {
      showAlert(mc, 'error', 'Could not load assessment: ' + formatError(e.detail));
    }
  }

  function renderQuestion(q, i) {
    const isObj = q.question_type?.toLowerCase() === 'objective' && q.options?.length;
    const opts = isObj
      ? q.options.map(o => `
          <label class="option-label" id="opt-label-${o.option_id}">
            <input type="radio" name="q${q.question_id}" value="${o.option_id}"
              onchange="selectOption(${q.question_id}, ${o.option_id}, 'opt-label-${o.option_id}', 'q${q.question_id}')">
            ${o.option_text}
            <span class="marks-badge">${q.marks} mk</span>
          </label>`).join('')
      : `<textarea rows="3" placeholder="Write your answer here…"
           oninput="answers['${q.question_id}'] = { answer_text: this.value }"
           style="font-size:.875rem"></textarea>`;

    return `
      <div class="question-card">
        <div class="q-num">Q${i + 1} · ${escapeHtml(q.question_type)}</div>
        <div class="q-text">${escapeHtml(q.question_text)}</div>
        ${opts}
      </div>`;
  }

  function selectOption(qid, oid, labelId, name) {
    answers[qid] = { selected_option_id: oid };
    document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
      r.closest('.option-label')?.classList.remove('selected');
    });
    document.getElementById(labelId)?.classList.add('selected');
  }

  async function startAndSubmit(assessmentId) {
    const ma = document.getElementById('modalAlert');
    const submitBtn = document.getElementById('submitBtn');
    ma.innerHTML = '';

    const unanswered = questions.filter(q => {
      const a = answers[q.question_id];
      if (!a) return true;
      if (q.question_type?.toLowerCase() === 'objective') return a.selected_option_id == null;
      return !a.answer_text?.trim();
    });

    if (unanswered.length) {
      showAlert(ma, 'error', `Please answer all questions. ${unanswered.length} remaining.`);
      return;
    }

    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Submitting…'; }

    try {
      const sub = await apiFetch(`/submissions?assessment_id=${assessmentId}`, { method: 'POST' });
      currentSubmission = sub.submission_id;

      const payload = questions.map(q => {
        const a = answers[q.question_id];
        return {
          question_id: q.question_id,
          selected_option_id: a.selected_option_id ?? null,
          answer_text: a.answer_text?.trim() || null,
        };
      });

      await apiFetch(`/submissions/${currentSubmission}/answers`, {
        method: 'POST',
        body: JSON.stringify(payload),
      });

      await apiFetch(`/submissions/${currentSubmission}/evaluate`, { method: 'POST' });

    const submissionId = currentSubmission;  // ← save it first
    closeModal();
    window.location.href = `feedback.html?submission_id=${submissionId}`;
    } catch (e) {
      showAlert(ma, 'error', 'Submission failed: ' + formatError(e.detail));
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Assessment'; }
    }
  }

  function closeModal() {
    document.getElementById('assessModal').classList.remove('show');
    currentAssessment = null;
    currentSubmission = null;
  }

  loadAssessments();
</script>
</body>
</html>
