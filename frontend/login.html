<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – SmartPortal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Smart<span>Portal</span></div>
    <p class="auth-sub">Student Assessment Platform</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign in</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>

    <div id="alertBox"></div>

    
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign in</button>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Your Name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min 6 characters" />
      </div>
      <div class="form-group">
        <label>Class</label>
        <input type="text" id="regClass" placeholder="e.g. 10A" />
      </div>
      <div class="form-group">
        <label>School</label>
        <input type="text" id="regSchool" placeholder="Your school name" />
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="doRegister()">Create account</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  redirectIfLoggedIn();

  function switchTab(tab) {
    document.getElementById('alertBox').innerHTML = '';
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd   = document.getElementById('loginPassword').value;
    const box   = document.getElementById('alertBox');
    if (!email || !pwd) { showAlert(box, 'error', 'Please fill in all fields.'); return; }

    try {
      const form = new URLSearchParams({ username: email, password: pwd });
      const data = await apiForm('/login', form);
      setToken(data.access_token);
      // fetch profile
      const profile = await apiFetch('/profile');
      if (profile) saveStudent(profile);
      window.location.href = 'index.html';
    } catch (e) {
      showAlert(box, 'error', e.detail || 'Login failed.');
    }
  }

  async function doRegister() {
    const box = document.getElementById('alertBox');
    const body = {
      name:          document.getElementById('regName').value.trim(),
      email:         document.getElementById('regEmail').value.trim(),
      password:      document.getElementById('regPassword').value,
      student_class: document.getElementById('regClass').value.trim(),
      school:        document.getElementById('regSchool').value.trim(),
    };
    if (Object.values(body).some(v => !v)) { showAlert(box, 'error', 'Please fill in all fields.'); return; }

    try {
      await apiFetch('/register', { method: 'POST', body: JSON.stringify(body) });
      showAlert(box, 'success', 'Account created! Please sign in.');
      switchTab('login');
      document.getElementById('loginEmail').value = body.email;
    } catch (e) {
      showAlert(box, 'error', e.detail || 'Registration failed.');
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const tab = document.getElementById('tabLogin').classList.contains('active') ? 'login' : 'register';
      tab === 'login' ? doLogin() : doRegister();
    }
  });
</script>
</body>
</html>
